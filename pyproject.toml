[project]
name = "newsbrief"
version = "0.8.9"
description = "Story-based News Aggregator with AI Synthesis"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --timeout=120"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestReturnNotNoneWarning",
]
markers = [
    # Renamed from requires_ollama (#360): tests carrying this marker are backend-aware
    # (Ollama or oMLX) since the #337/#339 backend-selection fixes, not Ollama-only.
    "requires_llm_backend: marks tests that need a live LLM backend, Ollama or oMLX (deselect with -m 'not requires_llm_backend')",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/__init__.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
# Raised from 34% to 45% (#360) -- actual coverage is 51% as of Aug 2026; 45% leaves
# some headroom below that while catching real regressions instead of drift back
# down. Re-raise as coverage improves further.
fail_under = 45

[tool.coverage.html]
directory = "htmlcov"

# Semantic Release Configuration
# Automatically determines version based on conventional commits:
#   feat: → minor bump (0.x.0)
#   fix:  → patch bump (0.0.x)
#   feat!: or BREAKING CHANGE: → major bump (x.0.0)
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_message = "chore(release): v{version} [skip ci]"
tag_format = "v{version}"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
template_dir = "templates"
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
name = "origin"
type = "github"
