name: CI Dev

on:
  push:
    branches: [dev]

permissions:
  contents: write    # manifest update commit + push
  packages: write    # push to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: deim0s13/newsbrief
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/_ci-shared.yml

  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      sha-tag: ${{ steps.tags.outputs.sha-tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          echo "sha-tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-latest
            ${{ steps.tags.outputs.sha-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}

  update-manifest:
    name: Update k8s Manifest
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update dev kustomization image tag
        run: |
          sed -i "s/newTag:.*/newTag: sha-${GITHUB_SHA}/" k8s/overlays/dev/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No manifest changes needed"
          else
            git commit -m "chore(cd): update dev image to sha-${GITHUB_SHA:0:7} [skip ci]"
            git push
          fi

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [ci, build-and-push, update-manifest]
    if: always()
    steps:
      - name: Send ntfy notification
        run: |
          if echo '${{ toJSON(needs) }}' | grep -q '"result":"failure"'; then
            PRIORITY="high"
            EMOJI="❌"
            STATUS="FAILED"
          else
            PRIORITY="default"
            EMOJI="✅"
            STATUS="passed"
          fi
          curl -s -X POST \
            -H "Priority: ${PRIORITY}" \
            -H "Title: NewsBrief CI dev ${EMOJI}" \
            -d "${STATUS}: ${GITHUB_SHA:0:7} — ${{ github.event.head_commit.message }}" \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
