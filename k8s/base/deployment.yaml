apiVersion: apps/v1
kind: Deployment
metadata:
  name: newsbrief
  labels:
    app.kubernetes.io/name: newsbrief
    app.kubernetes.io/component: api
  annotations:
    argocd.argoproj.io/sync-wave: "2"  # After migrate Job (wave 1)
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: newsbrief
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: newsbrief
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: newsbrief
          image: localhost:5000/newsbrief:dev-latest
          ports:
            - containerPort: 8787
              name: http
          envFrom:
            - configMapRef:
                name: newsbrief-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            # Mounted at /app/state, not /app/data (see #326) -- /app/data holds
            # read-only shipped config baked into the image and must never be
            # shadowed by a volume/emptyDir, or config changes committed to git
            # would never reach the running pod. settings.json (the one file
            # the app writes at runtime) lives under /app/state instead.
            - name: state
              mountPath: /app/state
      volumes:
        - name: state
          emptyDir: {}
