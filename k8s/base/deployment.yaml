apiVersion: apps/v1
kind: Deployment
metadata:
  name: newsbrief
  labels:
    app.kubernetes.io/name: newsbrief
    app.kubernetes.io/component: api
  annotations:
    argocd.argoproj.io/sync-wave: "2"  # After migrate Job (wave 1)
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: newsbrief
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: newsbrief
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: newsbrief
          # Placeholder only — never pulled as-is. Both overlays' kustomization.yaml
          # `images:` block rewrites this to ghcr.io/deim0s13/newsbrief:<real tag>.
          # "localhost:5000" is a leftover match-key from the removed local
          # registry (ADR-0020/ADR-0032) but still works fine as a search target.
          image: localhost:5000/newsbrief:dev-latest
          ports:
            - containerPort: 8787
              name: http
          envFrom:
            - configMapRef:
                name: newsbrief-config
          env:
            # oMLX API key (#343, macOS-only backend, ADR-0033). Intentionally
            # NOT a kustomize resource / not tracked by ArgoCD -- the
            # `newsbrief-omlx` Secret is created out-of-band per namespace via
            # `make k8s-omlx-secret` (never committed to git). If it were
            # git-tracked, ArgoCD's selfHeal would revert any real value back
            # to a placeholder on every reconcile.
            - name: OMLX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: newsbrief-omlx
                  key: api-key
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            # Mounted at /app/state, not /app/data (see #326) -- /app/data holds
            # read-only shipped config baked into the image and must never be
            # shadowed by a volume/emptyDir, or config changes committed to git
            # would never reach the running pod. settings.json (the one file
            # the app writes at runtime) lives under /app/state instead.
            - name: state
              mountPath: /app/state
      volumes:
        - name: state
          emptyDir: {}
