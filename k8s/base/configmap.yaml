apiVersion: v1
kind: ConfigMap
metadata:
  name: newsbrief-config
  labels:
    app.kubernetes.io/name: newsbrief
  annotations:
    argocd.argoproj.io/sync-wave: "0"  # Create config before deployment
data:
  # LLM Configuration
  # NEWSBRIEF_LLM_MODEL intentionally NOT set here (see #343) -- it would
  # unconditionally override SettingsService's device-aware profile
  # resolution (ADR-0033) for every deployment. NEWSBRIEF_DEVICE_TYPE +
  # OMLX_BASE_URL below assume both overlays run on this same macOS/kind
  # host today; revisit if either is ever deployed elsewhere.
  OLLAMA_BASE_URL: "http://host.containers.internal:11434"
  NEWSBRIEF_DEVICE_TYPE: "darwin"
  OMLX_BASE_URL: "http://host.containers.internal:8000"

  # Story Generation
  STORY_GENERATION_SCHEDULE: "0 6 * * *"
  STORY_GENERATION_TIMEZONE: "Pacific/Auckland"
  STORY_ARCHIVE_DAYS: "7"
  STORY_TIME_WINDOW_HOURS: "24"
  STORY_MIN_ARTICLES: "2"

  # Feed Refresh
  FEED_REFRESH_ENABLED: "true"
  FEED_REFRESH_SCHEDULE: "30 5 * * *"

  # Bulk Enrichment: summarize + embed (#328)
  BULK_ENRICH_ENABLED: "true"
  BULK_ENRICH_SCHEDULE: "45 5 * * *"
  BULK_ENRICH_BATCH_SIZE: "100"
  BULK_ENRICH_MAX_WORKERS: "3"

  # Fetch Limits
  NEWSBRIEF_MAX_ITEMS_PER_REFRESH: "150"
  NEWSBRIEF_MAX_ITEMS_PER_FEED: "50"
  NEWSBRIEF_MAX_REFRESH_TIME: "300"
