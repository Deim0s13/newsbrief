# kind cluster configuration for NewsBrief development
# Documentation: https://kind.sigs.k8s.io/docs/user/configuration/
#
# NOTE: there is no local registry — images come from GHCR
# (ghcr.io/deim0s13/newsbrief), pulled directly by ArgoCD-managed pods (see
# ADR-0020/ADR-0032). The containerdConfigPatches block below is a harmless
# leftover from when a local registry was used; nothing currently populates
# /etc/containerd/certs.d, so it's a no-op.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: newsbrief-dev

containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"

nodes:
  - role: control-plane
    # Port mappings allow access to services from localhost
    extraPortMappings:
      # HTTP ingress / ArgoCD
      - containerPort: 30080
        hostPort: 18080
        protocol: TCP
      # HTTPS ingress
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
    # Labels for ingress controller node selection
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
