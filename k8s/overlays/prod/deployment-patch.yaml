# Production deployment patches
# - Increased resources
# - Enhanced health checks
# - Pod anti-affinity for HA
# Note: Persistent storage (PVC) is handled via JSON patch in kustomization.yaml
#
# Why replicas: 2 + a PDB on a single-node kind cluster (#357): the anti-affinity
# below is a no-op today (there's only one node to schedule onto, so it can't
# actually spread pods) -- this is NOT multi-node HA. What it does buy, even on
# one node: zero-downtime rolling deploys (maxUnavailable: 0 means the old pod
# keeps serving until the new one is Ready) and survival of a single pod
# crashing/OOMing. The PDB (`pdb.yaml`, minAvailable: 1) protects that same
# property against voluntary evictions (kubectl drain, descheduler). If this
# ever moves to a real multi-node cluster, the anti-affinity starts pulling its
# weight for free -- until then, don't read this as evidence of a multi-node
# setup that doesn't exist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: newsbrief
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: newsbrief
                topologyKey: kubernetes.io/hostname
      containers:
        - name: newsbrief
          # Prod image tag (v<version>) is updated automatically by ci-prod.yml's
          # update-manifest job on each release — see kustomization.yaml's images:
          # block. imagePullPolicy: Always guards against any residual stale pull.
          imagePullPolicy: Always
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
