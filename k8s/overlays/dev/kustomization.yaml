apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: newsbrief-dev

namespace: newsbrief-dev

labels:
  - pairs:
      app.kubernetes.io/instance: dev
      environment: development
    includeSelectors: false

resources:
  - ../../base

# Override namespace name for dev
patches:
  - target:
      kind: Namespace
      name: newsbrief
    patch: |
      - op: replace
        path: /metadata/name
        value: newsbrief-dev
  - path: deployment-patch.yaml

images:
  - name: localhost:5000/newsbrief
    newName: ghcr.io/deim0s13/newsbrief
    # Tag updated automatically by ci-dev.yml update-manifest job on each push to dev
    newTag: sha-68ba333bb70a1fd240d268a3e884007f091d55bf

# Dev-specific configuration overrides
# DATABASE_URL is NOT here -- it lives in the newsbrief-db-credentials Secret
# (out-of-band, `make k8s-db-secret`), not a git-tracked literal (#357).
configMapGenerator:
  - name: newsbrief-config
    behavior: merge
    literals:
      - ENVIRONMENT=development
      - NEWSBRIEF_MAX_ITEMS_PER_REFRESH=50
      - NEWSBRIEF_MAX_ITEMS_PER_FEED=20
