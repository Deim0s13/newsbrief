# Dev image tag (sha-<short SHA>) is updated automatically by ci-dev.yml's
# update-manifest job on each push to dev — see kustomization.yaml's images:
# block. imagePullPolicy: Always guards against any residual stale pull.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: newsbrief
spec:
  template:
    spec:
      containers:
        - name: newsbrief
          imagePullPolicy: Always
