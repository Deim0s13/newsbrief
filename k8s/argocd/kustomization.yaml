apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: argocd-apps

resources:
  - project.yaml
  - argocd-cm.yaml
  # Individual apps -- one Application per environment. (An ApplicationSet
  # variant was considered and removed in #355: infra-start.sh applies this
  # directory with `kubectl apply -f` rather than through kustomize, so an
  # alternate appset.yaml living alongside these would get applied too and
  # fight over the same Application names.)
  - app-dev.yaml
  - app-prod.yaml
  # Notifications
  - notifications-cm.yaml
  - notifications-secret.yaml
